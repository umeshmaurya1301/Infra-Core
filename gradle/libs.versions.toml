# Centralized Version Management using Gradle Version Catalog
# This is the modern, recommended approach for dependency management in Gradle 7+

[versions]
# ===========================================
# CANONICAL VERSIONS (Current & Supported)
# ===========================================

# Core Framework Versions
springBoot = "4.1.1"
springSecurity = "7.1.0"
springData = "2026.0.0"

# Java & JVM
java = "25"
kotlin = "1.9.25"

# ===========================================
# DATABASE & PERSISTENCE
# ===========================================
postgresql = "42.7.4"
h2 = "2.3.232"
mysql = "8.0.33"
hikari = "5.1.0"
flyway = "10.21.0"
liquibase = "4.29.2"

# ===========================================
# SECURITY & CRYPTOGRAPHY
# ===========================================
jjwt = "0.12.6"
bouncyCastle = "1.79"
commonsCodec = "1.17.1"
oauth2ResourceServer = "6.4.1"

# ===========================================
# UTILITIES & COMMONS
# ===========================================
commonsLang3 = "3.17.0"
commonsCollections4 = "4.4"
commonsIo = "2.18.0"
guava = "33.3.1-jre"

# Code Generation
mapstruct = "1.6.3"

# ===========================================
# JSON & SERIALIZATION
# ===========================================
gson = "2.11.0"

# ===========================================
# LOGGING & MONITORING
# ===========================================
slf4j = "2.0.16"
logback = "1.5.12"
log4j2 = "2.24.3"
micrometer = "1.14.2"
prometheus = "1.3.5"

# ===========================================
# TESTING
# ===========================================
hamcrest = "3.0"
testcontainers = "1.20.4"

# ===========================================
# HTTP & WEB
# ===========================================
okHttp = "4.12.0"
apacheHttpClient = "5.4.1"
servletApi = "6.1.0"

# ===========================================
# CACHING
# ===========================================
ehcache = "3.10.8"
caffeine = "3.1.8"
redis = "7.4.1"

# ===========================================
# MESSAGE QUEUES & ASYNC
# ===========================================
rabbitmq = "5.22.0"
kafka = "3.9.0"

# ===========================================
# DOCUMENTATION
# ===========================================
springdoc = "2.7.0"
swagger = "2.2.26"

# ===========================================
# BUILD & DEVELOPMENT TOOLS
# ===========================================
dependencyManagement = "1.1.7"
spotbugs = "4.8.6"
pmd = "7.8.0"
checkstyle = "10.20.2"

# ===========================================
# VALIDATION
# ===========================================
validationApi = "3.1.0"
hibernateValidator = "8.0.1.Final"

[libraries]
# ===========================================
# SPRING BOOT STARTERS
# ===========================================
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# ===========================================
# DATABASE
# ===========================================
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
mysql = { module = "mysql:mysql-connector-java", version.ref = "mysql" }

# ===========================================
# SECURITY & JWT
# ===========================================
spring-security-oauth2-resource-server = { module = "org.springframework.security:spring-security-oauth2-resource-server", version.ref = "oauth2ResourceServer" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose", version.ref = "oauth2ResourceServer" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# ===========================================
# CRYPTOGRAPHY
# ===========================================
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncyCastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncyCastle" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }

# ===========================================
# UTILITIES
# ===========================================
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
commons-collections4 = { module = "org.apache.commons:commons-collections4", version.ref = "commonsCollections4" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

# ===========================================
# CODE GENERATION
# ===========================================
lombok = { module = "org.projectlombok:lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# ===========================================
# LOGGING
# ===========================================
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# ===========================================
# JSON
# ===========================================
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# ===========================================
# TESTING
# ===========================================
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
mockito-core = { module = "org.mockito:mockito-core" }
assertj-core = { module = "org.assertj:assertj-core" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[bundles]
# ===========================================
# DEPENDENCY BUNDLES
# ===========================================
spring-boot-starters = [
    "spring-boot-starter",
    "spring-boot-starter-web", 
    "spring-boot-starter-actuator",
    "spring-boot-starter-validation"
]

spring-security = [
    "spring-boot-starter-security",
    "spring-security-oauth2-resource-server",
    "spring-security-oauth2-jose"
]

jwt = [
    "jjwt-api",
    "jjwt-impl", 
    "jjwt-jackson"
]

cryptography = [
    "bouncycastle-provider",
    "bouncycastle-pkix",
    "commons-codec"
]

commons-utils = [
    "commons-lang3",
    "commons-collections4",
    "commons-io"
]

logging = [
    "slf4j-api",
    "logback-classic"
]

testing = [
    "spring-boot-starter-test",
    "junit-jupiter",
    "mockito-core",
    "assertj-core"
]

[plugins]
# ===========================================
# GRADLE PLUGINS
# ===========================================
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
